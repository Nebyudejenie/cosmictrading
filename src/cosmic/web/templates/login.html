{% extends "base.html" %}
{% block title %}Sign in · COSMICTRADING QUANT{% endblock %}
{% block content %}
<section class="card narrow">
  <h1>Sign in</h1>
  {% if error %}<p class="alert" role="alert">{{ error }}</p>{% endif %}
  <form method="post" action="/login" autocomplete="on">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label for="username">Username</label>
    <input id="username" name="username" required maxlength="64" autocomplete="username" autofocus>
    <label for="password">Password</label>
    <input id="password" name="password" type="password" required maxlength="256" autocomplete="current-password">
    <button type="submit">Sign in</button>
  </form>
  <p class="muted">An authenticator code is required after sign-in.</p>
</section>
{% endblock %}
