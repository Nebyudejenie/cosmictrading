# Remote SSH through Cloudflare Tunnel (ssh.<zone>), independent of the application stack so
# it keeps working while the app is stopped or redeployed.
#
#   COSMIC_SECRETS_DIR=... COSMIC_CONFIG_DIR=... COSMIC_BASTION_TAG=<tag> \
#     docker compose -f deploy/cloudflared/compose.ssh-access.yaml up -d
#
# Path: client → Cloudflare → tunnel → jump container (key-only, no shell, may forward only to
# the host's sshd) → host sshd (key login). The host's sshd is never exposed directly, so a
# weak or leaked host password cannot be used from the internet. Nothing is published.
# Client: ssh -J jump@ssh.<zone> cosmic@host.docker.internal with
#   ProxyCommand cloudflared access ssh --hostname ssh.<zone>   (see docs/15).
name: cosmictrading-ssh

services:
  bastion:
    image: cosmictrading-bastion:${COSMIC_BASTION_TAG:-local}
    build: { context: ../bastion }
    read_only: true
    tmpfs: ["/run:size=1m", "/etc/ssh/authorized:size=1m"]
    volumes:
      - bastion_hostkeys:/etc/ssh/keys
      - "${COSMIC_CONFIG_DIR:?set COSMIC_CONFIG_DIR}/bastion_authorized_keys:/etc/bastion/authorized_keys:ro"
    extra_hosts: ["host.docker.internal:host-gateway"]
    networks: [jump]
    cap_drop: [ALL]
    cap_add: [SETUID, SETGID, SYS_CHROOT, CHOWN, AUDIT_WRITE]
    security_opt: ["no-new-privileges:true"]
    deploy:
      resources:
        limits: { memory: 64m, cpus: "0.25", pids: 50 }
    logging: &logging
      driver: json-file
      options: { max-size: "5m", max-file: "3" }
    restart: unless-stopped

  cloudflared-ssh:
    image: cloudflare/cloudflared:2026.9.1@sha256:b269e8abd07a5bf6f3f4be65d5050b2174eca89c56a0241a8ff32a16aec454e4
    command: ["tunnel", "--no-autoupdate", "--metrics", "127.0.0.1:20250", "run",
              "--token-file", "/run/secrets/ssh_tunnel_token"]
    user: "${COSMIC_HOST_UID:-1000}:${COSMIC_HOST_GID:-1000}"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    secrets: [ssh_tunnel_token]
    networks: [jump]
    depends_on: [bastion]
    deploy:
      resources:
        limits: { memory: 96m, cpus: "0.25", pids: 50 }
    logging: *logging
    restart: unless-stopped

networks:
  jump:  # fixed, so the host firewall can let exactly this network reach sshd (docs/15 §8)
    driver_opts: { com.docker.network.bridge.name: br-cosmic-jump }
    ipam:
      config:
        - subnet: ${COSMIC_JUMP_SUBNET:-10.203.65.0/29}

volumes:
  bastion_hostkeys:
    name: cosmictrading_bastion_hostkeys

secrets:
  ssh_tunnel_token: { file: "${COSMIC_SECRETS_DIR:?set COSMIC_SECRETS_DIR}/ssh_tunnel_token" }
