# COSMICTRADING QUANT production stack (one dedicated VM; see docs/12).
#
# - No service publishes a port. The portal is reached only through Cloudflare Tunnel
#   (profile "tunnel"); SSH is the only inbound path to the VM.
# - Networks: "data" and "edge" are internal (no route to the internet). Only worker, bot
#   and cloudflared join "egress". The web process has no outbound internet access.
# - Secrets are files under ${COSMIC_SECRETS_DIR} (root:10001, 0440), mounted per service.
# - Live trading is impossible in this build: there is no live broker adapter and
#   COSMIC_MAX_AUTHORITY_MODE caps the stored mode.
#
# Usage on the VM (from the repository checkout):
#   COSMIC_IMAGE_TAG=<tag> docker compose -f deploy/compose.prod.yaml up -d --wait
#   ... --profile tunnel   (after the tunnel token exists, docs/12 §5)
#   ... --profile telegram (after a bot token exists)
name: cosmictrading

x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "5" }

x-app: &app
  image: cosmictrading:${COSMIC_IMAGE_TAG:?set COSMIC_IMAGE_TAG}
  init: true
  read_only: true
  tmpfs: ["/tmp:size=64m,mode=1777"]
  user: "10001:10001"
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  env_file: ["${COSMIC_ENV_FILE:-/srv/cosmic/config/cosmic.env}"]
  logging: *logging
  restart: unless-stopped

x-db-env: &db-env
  COSMIC_DB_HOST: postgres
  COSMIC_DB_PORT: "5432"
  COSMIC_DB_APP_PASSWORD_FILE: /run/secrets/db_app_password
  COSMIC_SECRET_KEY_FILE: /run/secrets/secret_key

# Least privilege per process: AI keys only in the worker, the Telegram token only in the
# bot. The web process holds neither; it shows what the worker/bot report (presence only).
x-ai-env: &ai-env
  <<: *db-env
  COSMIC_GROQ_API_KEY_FILE: /run/secrets/groq_api_key
  COSMIC_GEMINI_API_KEY_FILE: /run/secrets/gemini_api_key
  COSMIC_OPENROUTER_API_KEY_FILE: /run/secrets/openrouter_api_key

x-bot-env: &bot-env
  <<: *db-env
  COSMIC_TELEGRAM_BOT_TOKEN_FILE: /run/secrets/telegram_bot_token

services:
  postgres:
    image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/db_superuser_password
      POSTGRES_DB: postgres
      POSTGRES_INITDB_ARGS: "--data-checksums"
    command:
      - postgres
      - -c
      - max_connections=80
      - -c
      - shared_buffers=512MB
      - -c
      - effective_cache_size=1536MB
      - -c
      - work_mem=8MB
      - -c
      - maintenance_work_mem=128MB
      - -c
      - wal_compression=on
      - -c
      - max_wal_size=2GB
      - -c
      - log_min_duration_statement=2000
      - -c
      - log_connections=off
      - -c
      - password_encryption=scram-sha-256
    secrets: [db_superuser_password]
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [data]
    shm_size: 256m
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -h 127.0.0.1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    deploy:
      resources:
        limits: { memory: 2g, cpus: "1.5", pids: 300 }
    stop_grace_period: 60s
    logging: *logging
    restart: unless-stopped

  # One-shot: create roles/database if missing, then apply migrations (as cosmic_owner).
  migrate:
    <<: *app
    entrypoint: ["sh", "-c"]
    command: ["cosmic db bootstrap && cosmic db migrate"]
    environment:
      <<: *db-env
      COSMIC_DB_OWNER_PASSWORD_FILE: /run/secrets/db_owner_password
      COSMIC_DB_SUPERUSER_PASSWORD_FILE: /run/secrets/db_superuser_password
    secrets: [db_superuser_password, db_owner_password, db_app_password, secret_key]
    networks: [data]
    depends_on:
      postgres: { condition: service_healthy }
    deploy:
      resources:
        limits: { memory: 512m, cpus: "1.0" }
    restart: "no"

  web:
    <<: *app
    command: ["web"]
    environment:
      <<: *db-env
      COSMIC_WEB_HOST: 0.0.0.0
      COSMIC_WEB_PORT: "8000"
      COSMIC_METRICS_TOKEN_FILE: /run/secrets/metrics_token
      # Only cloudflared's fixed address may set X-Forwarded-For.
      COSMIC_FORWARDED_ALLOW_IPS: ${COSMIC_EDGE_CLOUDFLARED_IP:-10.203.64.10}
    secrets:
      - db_app_password
      - secret_key
      - metrics_token
    networks:
      data: {}
      edge: { ipv4_address: "${COSMIC_EDGE_WEB_IP:-10.203.64.20}" }
    depends_on:
      migrate: { condition: service_completed_successfully }
    healthcheck:
      # stdlib only (no app imports): `cosmic probe web` costs ~1.6 s CPU per run.
      test: ["CMD", "python", "-I", "-S", "-c", "import sys, urllib.request as u; sys.exit(0 if u.urlopen('http://127.0.0.1:8000/readyz', timeout=4).status == 200 else 1)"]
      interval: 30s
      timeout: 6s
      retries: 4
      start_period: 20s
    deploy:
      resources:
        limits: { memory: 512m, cpus: "1.0", pids: 200 }

  worker:
    <<: *app
    command: ["worker"]
    environment:
      <<: *ai-env
      # Free-space checks measure the filesystem that holds the backups (read-only mount).
      COSMIC_DATA_PATH: /mnt/backups
      COSMIC_HEARTBEAT_FILE: /tmp/worker.heartbeat
    secrets: [db_app_password, secret_key, groq_api_key, gemini_api_key, openrouter_api_key]
    volumes:
      - "${COSMIC_BACKUP_DIR:-/srv/cosmic/backups}:/mnt/backups:ro"
    networks: [data, egress]
    depends_on:
      migrate: { condition: service_completed_successfully }
    healthcheck:
      # The file is touched after each successful DB heartbeat (every 15 s).
      test: ["CMD", "python", "-I", "-S", "-c", "import os, sys, time; sys.exit(0 if time.time() - os.stat('/tmp/worker.heartbeat').st_mtime < 60 else 1)"]
      interval: 30s
      timeout: 8s
      retries: 4
      start_period: 60s
    deploy:
      resources:
        limits: { memory: 1g, cpus: "1.5", pids: 200 }
    stop_grace_period: 30s

  bot:
    <<: *app
    profiles: [telegram]
    command: ["bot"]
    environment: *bot-env
    secrets: [db_app_password, secret_key, telegram_bot_token]
    networks: [data, egress]
    depends_on:
      migrate: { condition: service_completed_successfully }
    deploy:
      resources:
        limits: { memory: 384m, cpus: "0.5", pids: 100 }

  # Remotely-managed tunnel: ingress rules live in the Cloudflare dashboard (docs/12 §5).
  cloudflared:
    image: cloudflare/cloudflared:2026.9.1@sha256:b269e8abd07a5bf6f3f4be65d5050b2174eca89c56a0241a8ff32a16aec454e4
    profiles: [tunnel]
    command: ["tunnel", "--no-autoupdate", "--metrics", "127.0.0.1:20241", "run",
              "--token-file", "/run/secrets/tunnel_token"]
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    secrets: [tunnel_token]
    networks:
      edge: { ipv4_address: "${COSMIC_EDGE_CLOUDFLARED_IP:-10.203.64.10}" }
      egress: {}
    depends_on:
      web: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "cloudflared", "tunnel", "--metrics", "127.0.0.1:20241", "ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits: { memory: 128m, cpus: "0.5", pids: 100 }
    logging: *logging
    restart: unless-stopped

  # Encrypted logical backup (run by cosmic-backup.timer: deploy/backup/backup.sh).
  backup:
    image: cosmictrading-backup:${COSMIC_IMAGE_TAG:?set COSMIC_IMAGE_TAG}
    build: { context: backup }
    profiles: [backup]
    user: "10001:10001"
    read_only: true
    tmpfs: ["/tmp:size=16m"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    entrypoint: ["/usr/local/bin/cosmic-backup"]
    environment:
      PGHOST: postgres
      PGDATABASE: cosmic
      PGUSER: cosmic_owner
    secrets: [db_owner_password]
    volumes:
      - "${COSMIC_BACKUP_DIR:-/srv/cosmic/backups}:/backups"
      - "${COSMIC_CONFIG_DIR:-/srv/cosmic/config}:/config:ro"
    networks: [data]
    deploy:
      resources:
        limits: { memory: 512m, cpus: "1.0" }
    logging: *logging
    restart: "no"

  backup-prune:
    <<: *app
    profiles: [backup]
    command: ["backup", "prune", "--dir", "/backups"]
    environment: {}
    env_file: []
    volumes:
      - "${COSMIC_BACKUP_DIR:-/srv/cosmic/backups}:/backups"
    network_mode: none
    restart: "no"

networks:
  data:
    internal: true
  edge:
    internal: true
    ipam:
      config:
        - subnet: ${COSMIC_EDGE_SUBNET:-10.203.64.0/27}
  egress: {}

volumes:
  pgdata:
    name: cosmictrading_pgdata

secrets:
  db_superuser_password: { file: "${COSMIC_SECRETS_DIR:-/srv/cosmic/secrets}/db_superuser_password" }
  db_owner_password: { file: "${COSMIC_SECRETS_DIR:-/srv/cosmic/secrets}/db_owner_password" }
  db_app_password: { file: "${COSMIC_SECRETS_DIR:-/srv/cosmic/secrets}/db_app_password" }
  secret_key: { file: "${COSMIC_SECRETS_DIR:-/srv/cosmic/secrets}/secret_key" }
  metrics_token: { file: "${COSMIC_SECRETS_DIR:-/srv/cosmic/secrets}/metrics_token" }
  groq_api_key: { file: "${COSMIC_SECRETS_DIR:-/srv/cosmic/secrets}/groq_api_key" }
  gemini_api_key: { file: "${COSMIC_SECRETS_DIR:-/srv/cosmic/secrets}/gemini_api_key" }
  openrouter_api_key: { file: "${COSMIC_SECRETS_DIR:-/srv/cosmic/secrets}/openrouter_api_key" }
  telegram_bot_token: { file: "${COSMIC_SECRETS_DIR:-/srv/cosmic/secrets}/telegram_bot_token" }
  tunnel_token: { file: "${COSMIC_SECRETS_DIR:-/srv/cosmic/secrets}/tunnel_token" }
