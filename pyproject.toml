[project]
name = "cosmictrading-quant"
version = "0.1.0"
description = "Evidence-driven crypto research with a human-approved trading engine (paper mode)."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Proprietary" }
dependencies = [
  "fastapi",
  "uvicorn",
  "uvloop; sys_platform != 'win32'",
  "httptools",
  "jinja2",
  "python-multipart",
  "pydantic",
  "pydantic-settings",
  "sqlalchemy[asyncio]",
  "asyncpg",
  "alembic",
  "httpx",
  "structlog",
  "argon2-cffi",
  "pyotp",
  "cryptography",
  "aiogram>=3.31.0",
]

[project.scripts]
cosmic = "cosmic.cli:main"

[dependency-groups]
dev = [
  "pytest",
  "pytest-asyncio",
  "hypothesis",
  "ruff",
  "mypy",
  "pip-audit",
  "bandit",
  "pyyaml>=6.0.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cosmic"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "C4", "SIM", "RUF", "DTZ", "PT"]
ignore = ["S101", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"src/**" = ["PT018"]  # type-narrowing asserts are not test assertions
# Host-side verification driver: fixed docker argv; SQL interpolates only UUIDs the driver
# extracted with a strict regex or read back from the database; non-cryptographic jitter.
"scripts/**" = ["S311", "S603", "S607", "S608"]
"tests/**" = ["S105", "S106", "S311", "S603", "S607", "DTZ001", "PT011", "PT012", "PT018", "PT019", "PT022", "E501", "C408", "ASYNC240"]
"src/cosmic/db/migrations/**" = ["E501", "S608"]  # DDL with config-quoted identifiers

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["cosmic"]

[[tool.mypy.overrides]]
module = ["MetaTrader5", "MetaTrader5.*"]  # Windows-only official package (the MT5 bridge)
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["pyotp.*", "asyncpg.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
addopts = "-ra --strict-markers"
markers = [
  "db: needs the development PostgreSQL (fails, not skips, when unavailable)",
  "live_data: performs real keyless network calls (opt-in)",
  "sandbox: real Binance Spot Test Network calls with the owner's testnet keys (opt-in)",
]
filterwarnings = ["error::DeprecationWarning:cosmic.*"]

[tool.bandit]
# Reviewed 2026-10-11 (S10):
# - B101: remaining asserts only narrow types after explicit checks; every safety decision
#   (execution, risk, approvals, AI key) uses explicit exceptions instead.
# - migrations: owner-run DDL whose only interpolated values are role names from
#   configuration (B608 false positives); application SQL stays scanned.
skips = ["B101"]
exclude_dirs = ["src/cosmic/db/migrations"]
